name: Pages
# Veröffentlicht die Seite auf GitHub Pages: https://<user>.github.io/<repo>/
# Ohne Repository-Variablen VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY wird der Direktverbindungs-Modus
# (P2P: Geräte spielen ohne Backend miteinander, Host-Browser = Server) veröffentlicht; mit beiden
# Variablen der Supabase-Online-Build.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (Online, wenn Supabase konfiguriert ist)
        if: ${{ vars.VITE_SUPABASE_URL != '' && vars.VITE_SUPABASE_ANON_KEY != '' }}
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build -- --base ./ && echo "SITE_DIR=dist" >> "$GITHUB_ENV"
      - name: Build (Direktverbindung / P2P)
        if: ${{ vars.VITE_SUPABASE_URL == '' || vars.VITE_SUPABASE_ANON_KEY == '' }}
        run: npm run build:demo -- --base ./ && echo "SITE_DIR=dist-demo" >> "$GITHUB_ENV"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
