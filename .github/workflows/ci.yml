name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:songs
      - run: npm run build
      - name: E2E (lokaler Testmodus)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
          npm run test:e2e:p2p
