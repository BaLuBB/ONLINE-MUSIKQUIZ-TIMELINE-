name: Supabase einrichten
# Spielt Datenbank-Schema und Edge Function in DEIN Supabase-Projekt ein – ohne lokale Kommandozeile.
# Einmalig nötig (Repo → Settings → Secrets and variables → Actions):
#   Secrets:   SUPABASE_ACCESS_TOKEN  (supabase.com → Account → Access Tokens)
#              SUPABASE_DB_PASSWORD   (das Datenbank-Passwort, das du beim Anlegen des Projekts vergeben hast)
#   Variables: SUPABASE_PROJECT_REF   (Project Settings → General → Reference ID)
#              VITE_SUPABASE_URL      (Project Settings → API → Project URL)
#              VITE_SUPABASE_ANON_KEY (Project Settings → API → anon / publishable key)
# Zusätzlich im Supabase-Dashboard: Authentication → Sign In / Providers → „Allow anonymous sign-ins“ einschalten.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Projekt verknüpfen
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Datenbank-Migration einspielen
        run: yes | supabase db push
      - name: Edge Function deployen
        run: supabase functions deploy game --project-ref "$PROJECT_REF"
      - name: Function-Einstellungen setzen
        run: supabase secrets set AUDIO_PROVIDER=itunes ITUNES_COUNTRY=DE ALLOWED_ORIGIN="${{ vars.ALLOWED_ORIGIN || '*' }}" --project-ref "$PROJECT_REF"
