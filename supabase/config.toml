# Supabase-CLI-Konfiguration (lokale Entwicklung mit `supabase start`)
project_id = "timeline-musikquiz"

[api]
enabled = true
port = 54321
schemas = ["public"]

[db]
port = 54322
major_version = 15

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
# Anonyme Sitzungen: kein Konto nötig, aber eine stabile, nicht erratbare Identität pro Browser.
enable_anonymous_sign_ins = true

[realtime]
enabled = true

[functions.game]
verify_jwt = true
